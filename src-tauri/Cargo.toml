[package]
name = "voice-recorder"
version = "0.1.2"
description = "Dictado por voz con Groq Whisper + Claude"
authors = ["Alexander940"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voice_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.7.0"
enigo = "0.6.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
cpal = "0.18.2"
hound = "3.5.1"
tracing = "0.1.44"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "multipart", "json", "native-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
regex = "1.13.1"
tauri-plugin-store = "2.5.0"
tauri-plugin-autostart = "2.7.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
sys-locale = "0.3.2"
tauri-plugin-updater = "2.14.0"
semver = "1.0.28"
minisign-verify = "0.3.0"
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
minisign = "0.10.0"
mockito = "1.7.2"
tempfile = "3.27.0"
tracing-test = "0.2.6"
whatlang = "0.18.0"

# Menos información de depuración: los PDB de debug/test llenaban el disco.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
