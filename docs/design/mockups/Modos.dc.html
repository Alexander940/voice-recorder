<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Modos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA}a:hover{color:#312E81}
</style>
</helmet>
<div style="width: 960px; height: 640px; box-sizing: border-box; background: #FFFFFF; font-family: Geist, system-ui, sans-serif; color: #15171C; display: flex; flex-direction: column">
  <div style="height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #E6E8EC; background: #F6F7F9; font-size: 12px; font-weight: 500; color: #5B616E">Voice Recorder</div>
  <div style="flex-grow: 1; display: flex; min-height: 0">
    <nav aria-label="Secciones" style="width: 212px; flex-shrink: 0; box-sizing: border-box; background: #F6F7F9; border-right: 1px solid #E6E8EC; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px">
      <a href="Historial.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: #3A3F4A; font-size: 14px; font-weight: 500; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Historial</a>
      <a href="Modos.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 0 0 1px #E6E8EC; color: #15171C; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Modos</a>
      <a href="Vocabulario.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: #3A3F4A; font-size: 14px; font-weight: 500; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path></svg>Vocabulario</a>
      <div style="height: 1px; background: #E6E8EC; margin: 10px 4px"></div>
      <a href="Ajustes.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: #3A3F4A; font-size: 14px; font-weight: 500; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Ajustes</a>
      <a href="Cuentas.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: #3A3F4A; font-size: 14px; font-weight: 500; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3"></path></svg>Cuentas</a>
      <a href="Actualizaciones.dc.html" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: #3A3F4A; font-size: 14px; font-weight: 500; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3.5M4 4v4h4"></path><path d="M4 13a8 8 0 0 0 14.9 3.5M20 20v-4h-4"></path></svg>Actualizaciones</a>
      <div style="flex-grow: 1"></div>
      <div style="border: 1px solid #E6E8EC; background: #FFFFFF; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #8A8F98"></span>Listo para dictar</div>
        <span style="align-self: flex-start; font-family: 'Geist Mono', monospace; font-size: 12px; padding: 3px 7px; border: 1px solid #D5D8DE; border-bottom-width: 2px; border-radius: 6px; background: #F6F7F9">Option+Space</span>
        <span style="font-size: 12px; color: #5B616E">Modo: Email</span>
      </div>
    </nav>
    <main style="flex-grow: 1; min-width: 0; display: flex; gap: 0; overflow: hidden">
      <div style="width: 300px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid #E6E8EC; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Modos</h1>
          <button style="height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font: 600 13px Geist, system-ui, sans-serif; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nuevo</button>
        </div>
        <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #5B616E">El modo activo decide cómo Claude da formato a cada dictado. Cámbialo con <span style="font-family: 'Geist Mono', monospace; font-size: 12px">Ctrl+Option+M</span>.</p>
        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
          <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden">Modo activo</legend>
          <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14px"><input type="radio" name="mode" style="accent-color: {{accent}}; width: 16px; height: 16px; margin: 0">Literal<span style="margin-left: auto; font-size: 12px; color: #5B616E">sin IA</span></label>
          <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14px"><input type="radio" name="mode" style="accent-color: {{accent}}; width: 16px; height: 16px; margin: 0">Limpio</label>
          <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14px; font-weight: 600; background: #EEF2FF; box-shadow: inset 0 0 0 1.5px {{accent}}"><input type="radio" name="mode" checked style="accent-color: {{accent}}; width: 16px; height: 16px; margin: 0">Email<span style="margin-left: auto; font-size: 12px; font-weight: 600; color: #3730A3">Activo</span></label>
          <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14px"><input type="radio" name="mode" style="accent-color: {{accent}}; width: 16px; height: 16px; margin: 0">Mensaje</label>
          <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14px"><input type="radio" name="mode" style="accent-color: {{accent}}; width: 16px; height: 16px; margin: 0">Prompt técnico</label>
          <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14px"><input type="radio" name="mode" style="accent-color: {{accent}}; width: 16px; height: 16px; margin: 0">Traducir al inglés</label>
          <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 9px; font-size: 14px"><input type="radio" name="mode" style="accent-color: {{accent}}; width: 16px; height: 16px; margin: 0">Tuits<span style="margin-left: auto; font-size: 12px; color: #5B616E">tuyo</span></label>
        </fieldset>
      </div>
      <form aria-label="Editar modo" style="flex-grow: 1; min-width: 0; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B616E">Modo predefinido</span>
          <div style="display: flex; gap: 6px">
            <button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #D5D8DE; border-radius: 8px; background: #FFFFFF; font: 500 13px Geist, system-ui, sans-serif; color: #15171C">Duplicar</button>
          </div>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Nombre
          <input value="Email" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D5D8DE; border-radius: 9px; font: 400 14px Geist, system-ui, sans-serif; color: #15171C">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Instrucciones para Claude
          <textarea rows="6" style="box-sizing: border-box; padding: 10px 12px; border: 1px solid #D5D8DE; border-radius: 9px; font: 400 14px/1.5 Geist, system-ui, sans-serif; color: #15171C; resize: none">Da formato de correo electrónico: saludo, cuerpo en párrafos y despedida. Tono profesional y cordial. No inventes nombres: si no se menciona al destinatario, usa un saludo genérico.</textarea>
        </label>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: end">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Idioma de salida
            <input placeholder="El del dictado" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D5D8DE; border-radius: 9px; font: 400 14px Geist, system-ui, sans-serif">
          </label>
          <label style="display: flex; align-items: center; gap: 10px; height: 40px; font-size: 14px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 16px; height: 16px; margin: 0">Procesar con Claude</label>
        </div>
        <div style="flex-grow: 1"></div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 16px; border-top: 1px solid #E6E8EC">
          <button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #D5D8DE; border-radius: 10px; background: #FFFFFF; font: 500 14px Geist, system-ui, sans-serif; color: #15171C">Cancelar</button>
          <button type="submit" style="height: 40px; padding: 0 20px; border: 0; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font: 600 14px Geist, system-ui, sans-serif">Guardar</button>
        </div>
      </form>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4F46E5","options":["#4F46E5","#15171C","#0F766E","#C2410C"]},"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#4F46E5' };
  }
}
</script>
</body>
</html>
