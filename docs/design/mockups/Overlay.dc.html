<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Overlay de grabación</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA}a:hover{color:#312E81}
</style>
</helmet>
<div style="width: 760px; height: 440px; box-sizing: border-box; background: #ECEEF2; font-family: Geist, system-ui, sans-serif; color: #15171C; padding: 36px 40px; display: grid; grid-template-columns: 120px minmax(0, 1fr); row-gap: 28px; column-gap: 24px; align-items: center">

  <span style="font-size: 13px; font-weight: 600; color: #3A3F4A">Grabando</span>
  <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
    <div role="status" aria-label="Grabando" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 8px 0 18px; border-radius: 999px; background: #1C1C20; color: #F4F4F5; box-shadow: 0 8px 24px rgba(21,23,28,0.22)">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: {{rec}}; box-shadow: 0 0 0 4px rgba(217,45,45,0.25)"></span>
      <svg width="92" height="22" viewBox="0 0 92 22" aria-hidden="true"><g fill="#F4F4F5"><rect x="0" y="8" width="4" height="6" rx="2"></rect><rect x="8" y="5" width="4" height="12" rx="2"></rect><rect x="16" y="2" width="4" height="18" rx="2"></rect><rect x="24" y="0" width="4" height="22" rx="2"></rect><rect x="32" y="4" width="4" height="14" rx="2"></rect><rect x="40" y="1" width="4" height="20" rx="2"></rect><rect x="48" y="6" width="4" height="10" rx="2"></rect></g><g fill="#F4F4F5" opacity="0.28"><rect x="56" y="9" width="4" height="4" rx="2"></rect><rect x="64" y="9" width="4" height="4" rx="2"></rect><rect x="72" y="9" width="4" height="4" rx="2"></rect><rect x="80" y="9" width="4" height="4" rx="2"></rect><rect x="88" y="9" width="4" height="4" rx="2"></rect></g></svg>
      <span style="font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: #3F3F46">Email</span>
      <span style="font: 500 14px 'Geist Mono', monospace; min-width: 36px">0:07</span>
      <button aria-label="Cancelar grabación" style="width: 34px; height: 34px; border: 0; border-radius: 17px; background: #2E2E34; color: #F4F4F5; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <span style="font-size: 12px; color: #4B5160; padding-left: 18px">Pulsa <span style="font-family: 'Geist Mono', monospace">Option+Space</span> para terminar · Esc para cancelar</span>
  </div>

  <span style="font-size: 13px; font-weight: 600; color: #3A3F4A">Procesando</span>
  <div role="status" aria-label="Procesando" style="justify-self: start; display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 20px 0 18px; border-radius: 999px; background: #1C1C20; color: #F4F4F5; box-shadow: 0 8px 24px rgba(21,23,28,0.22)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#3F3F46" stroke-width="3"></circle><path d="M21 12a9 9 0 0 0-9-9" stroke="#F4F4F5" stroke-width="3" stroke-linecap="round"></path></svg>
    <span style="font-size: 14px; font-weight: 600">Puliendo con Claude…</span>
    <span style="font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: #3F3F46">Email</span>
  </div>

  <span style="font-size: 13px; font-weight: 600; color: #3A3F4A">Pegado</span>
  <div role="status" aria-label="Pegado" style="justify-self: start; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px 0 16px; border-radius: 999px; background: #1C1C20; color: #F4F4F5; box-shadow: 0 8px 24px rgba(21,23,28,0.22)">
    <span style="width: 24px; height: 24px; border-radius: 12px; background: #16A34A; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
    <span style="font-size: 14px; font-weight: 600">Pegado</span>
    <span style="font-size: 13px; color: #A1A1AA">48 palabras · 1,2 s</span>
  </div>

  <span style="font-size: 13px; font-weight: 600; color: #3A3F4A">Error</span>
  <div role="alert" style="justify-self: start; display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 8px 0 16px; border-radius: 999px; background: #1C1C20; color: #F4F4F5; box-shadow: 0 8px 24px rgba(21,23,28,0.22)">
    <span style="width: 24px; height: 24px; border-radius: 12px; background: {{rec}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">!</span>
    <span style="font-size: 14px; font-weight: 600">Sin conexión con Groq</span>
    <span style="font-size: 13px; color: #A1A1AA">El audio sigue guardado</span>
    <button style="height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: #F4F4F5; color: #15171C; font: 600 13px Geist, system-ui, sans-serif">Reintentar</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rec":{"editor":"color","default":"#D92D2D","options":["#D92D2D","#E5484D","#F97316"]},"$preview":{"width":760,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    return { rec: this.props.rec ?? '#D92D2D' };
  }
}
</script>
</body>
</html>
